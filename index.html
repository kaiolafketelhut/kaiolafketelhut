<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>BOA 84 - KaiOS</title>
<style>body{font-family:monospace;background:#000;color:#0f0;padding:10px} h1{font-size:18px} pre{background:#111;padding:10px;overflow:auto} button{background:#0f0;color:#000;padding:10px;border:none;width:100%;margin:5px 0}</style>
</head>
<body>
<h1>BOA 84 Flops<br>KDP KL5UQ4f48673352</h1>
<pre id="log">Loading KaiOS.json...</pre>
<button onclick="load()">Reload KaiOS.json</button>
<button onclick="fetchMatrix()">Fetch :8038/matrix</button>
<script>
function load(){
  fetch('KaiOS.json').then(r=>r.json()).then(j=>{
    document.getElementById('log').textContent=JSON.stringify(j,null,2)+"\n\n✅ "+j.FLOP_QUADRUPLE+" = "+j.total_flops_quadruple+" flops\nBOA: "+j.BOA+"\nIANA: "+j.IANA+"\nPORT: "+j.PORT;
  });
}
function fetchMatrix(){
  var xhr=new XMLHttpRequest({mozSystem:true});
  xhr.open('GET','http://localhost:8038/matrix',true);
  xhr.onload=function(){ document.getElementById('log').textContent=xhr.responseText; };
  xhr.onerror=function(){ document.getElementById('log').textContent='No local server - showing KaiOS.json\n'; load(); };
  xhr.send();
}
load();
</script>
</body>
</html>
