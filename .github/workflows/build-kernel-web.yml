name: build-kernel-web
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libc6-dev-i386 flex bison bc libelf-dev libssl-dev cpio xz-utils jq curl bzip2
      - name: Build busybox (static, 32-bit)
        run: |
          set -eux
          curl -fL -o bb.tar.bz2 https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar xf bb.tar.bz2
          cd busybox-1.36.1
          make defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/; s/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          make CC="gcc -m32" -j$(nproc) busybox
          cp busybox ../rootfs-busybox
      - name: Build latest kernel
        run: |
          set -eux
          V=$(curl -fsSL https://www.kernel.org/releases.json | jq -r '.latest_stable.version')
          echo "KVER=$V" >> $GITHUB_ENV
          curl -fL -o linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v${V%%.*}.x/linux-$V.tar.xz
          tar xf linux.tar.xz
          mkdir -p rootfs
          cp rootfs-busybox rootfs/busybox
          cat > rootfs/init <<'IEOF'
          #!/bin/busybox sh
          /bin/busybox --install -s /bin
          export PATH=/bin
          mount -t proc proc /proc
          mount -t sysfs sys /sys
          mount -t devtmpfs dev /dev
          echo "TINYoeneye web - Linux $(uname -r)"
          exec setsid cttyhack sh
          IEOF
          chmod +x rootfs/init
          cat > rootfs.list <<LEOF
          dir /dev 0755 0 0
          nod /dev/console 0600 0 0 c 5 1
          nod /dev/null 0666 0 0 c 1 3
          dir /bin 0755 0 0
          dir /proc 0755 0 0
          dir /sys 0755 0 0
          dir /tmp 1777 0 0
          dir /root 0700 0 0
          file /bin/busybox $GITHUB_WORKSPACE/rootfs/busybox 0755 0 0
          file /init $GITHUB_WORKSPACE/rootfs/init 0755 0 0
          LEOF
          cd linux-$V
          make ARCH=i386 tinyconfig
          ./scripts/config -e BLK_DEV_INITRD -e TTY -e SERIAL_8250 -e SERIAL_8250_CONSOLE -e PRINTK -e BINFMT_ELF -e BINFMT_SCRIPT -e DEVTMPFS -e PROC_FS -e SYSFS -e UNIX98_PTYS -e MULTIUSER -e FUTEX -e EPOLL -e SIGNALFD -e TIMERFD -e EVENTFD -e SHMEM -e TMPFS -e FILE_LOCKING -e RD_GZIP -e INITRAMFS_COMPRESSION_GZIP -e M686 --set-str INITRAMFS_SOURCE "$GITHUB_WORKSPACE/rootfs.list"
          make ARCH=i386 olddefconfig
          make ARCH=i386 -j$(nproc) bzImage
      - name: Publish
        run: |
          set -eux
          mkdir -p web-linux
          cp linux-$KVER/arch/x86/boot/bzImage web-linux/bzImage
          echo "$KVER" > web-linux/VERSION
          ls -lh web-linux
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f web-linux
          git commit -m "Linux $KVER web kernel" || true
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-pages.yml || true
