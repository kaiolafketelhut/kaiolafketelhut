name: auto INDEX -> index
on: [push]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp INDEX.HTML index.html || cp index.html INDEX.HTML
          git config user.name "kai"
          git config user.email "kai@fieldberry.local"
          git add index.html INDEX.HTML || true
          git diff --cached --quiet || git commit -m "auto sync INDEX.HTML"
          git push || true
