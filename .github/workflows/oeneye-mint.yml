name: oeneye-mint-iso
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/oeneye-mint.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap debian-archive-keyring xorriso squashfs-tools
      - name: Configure
        run: |
          mkdir -p lb && cd lb
          sudo lb config \
            --security false \
            --mode debian --distribution bookworm --firmware-chroot false \
            --archive-areas "main contrib non-free-firmware" \
            --binary-images iso-hybrid --debian-installer false \
            --iso-volume "OENEYE-MINT-1.05rc" \
            --iso-application "oeneye Mint 1.05 rc" \
            --bootappend-live "boot=live components quiet splash username=oeneye hostname=oeneye-mint"
          sudo mkdir -p config/archives config/package-lists
          echo 'deb http://security.debian.org/debian-security bookworm-security main contrib non-free-firmware' | sudo tee config/archives/security.list.chroot
          sudo tee config/package-lists/oeneye.list.chroot >/dev/null <<'PKG'
          task-cinnamon-desktop
          lightdm
          firefox-esr
          calamares
          calamares-settings-debian
          network-manager-gnome
          gnome-terminal
          nemo
          gedit
          sudo
          PKG
      - name: Copy boot-check overlay
        run: sudo cp -r iso/mint/includes.chroot lb/config/
      - name: Build ISO
        run: |
          cd lb
          sudo lb build
          sudo mv live-image-amd64.hybrid.iso ../oeneye-mint-1.05rc-amd64.iso
      - name: Checksums
        run: sha256sum oeneye-mint-1.05rc-amd64.iso > oeneye-mint-1.05rc-amd64.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: oeneye-mint-iso
          path: |
            oeneye-mint-1.05rc-amd64.iso
            oeneye-mint-1.05rc-amd64.iso.sha256
      - name: Raw backup release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: oeneye-mint-1.05rc
          prerelease: true
          files: |
            oeneye-mint-1.05rc-amd64.iso
            oeneye-mint-1.05rc-amd64.iso.sha256
