name: DOCTYPE = BLUH.XKTS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: DOCTYPE Track = BLUH.XKTS
        run: |
          echo "index.html tracking IS my doctype = BLUH.XKTS"
          ls -lh BLUH.XKTS bluh.xkts || true

      - name: Push track to bluh + gh-pages
        run: |
          git config user.name "kaiolafketelhut"
          git config user.email "kaiolafketelhut@users.noreply.github.com"
          git push origin main:bluh --force
          git push origin main:gh-pages --force
