name: build-oeneye-isos
on:
  workflow_dispatch:
    inputs:
      which:
        description: Which ISO to build
        type: choice
        default: all
        options: [all, debian, void, lubuntu]
jobs:
  debian:
    if: inputs.which == 'all' || inputs.which == 'debian'
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap debian-archive-keyring squashfs-tools xorriso
      - name: Configure
        run: |
          mkdir live && cd live
          lb config --mode debian --debian-installer false --initsystem systemd --firmware-chroot false --firmware-binary false --distribution trixie --security false --mirror-bootstrap http://deb.debian.org/debian/ --mirror-chroot http://deb.debian.org/debian/ --mirror-binary http://deb.debian.org/debian/ --mirror-chroot-security http://deb.debian.org/debian-security/ --mirror-binary-security http://deb.debian.org/debian-security/ \
            --archive-areas "main contrib non-free-firmware" \
            --binary-images iso-hybrid \
            --iso-application oeneye --iso-volume oeneye
          mkdir -p config/package-lists config/includes.chroot/etc
          printf '%s\n' task-xfce-desktop live-task-standard > config/package-lists/base.list.chroot
          printf 'NAME="oeneye"\nID=oeneye\nID_LIKE=debian\nPRETTY_NAME="oeneye (Debian base)"\n' > config/includes.chroot/etc/os-release
      - name: Build
        run: cd live && sudo sed -i "2i exit 0" /usr/lib/live/build/lb_binary_debian-installer && sudo mkdir -p .build && sudo touch .build/binary_debian-installer && sudo lb build
      - uses: actions/upload-artifact@v4
        with:
          name: oeneye-debian-iso
          path: live/*.iso
  lubuntu:
    if: inputs.which == 'all' || inputs.which == 'lubuntu'
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso
      - name: Configure
        run: |
          mkdir live && cd live
          lb config --mode ubuntu --debian-installer false --bootloader grub --distribution noble \
            --archive-areas "main restricted universe multiverse" \
            --binary-images iso-hybrid \
            --iso-application oeneye --iso-volume oeneye
          mkdir -p config/package-lists config/includes.chroot/etc
          printf '%s\n' lubuntu-desktop > config/package-lists/base.list.chroot
          printf 'NAME="oeneye"\nID=oeneye\nID_LIKE=ubuntu\nPRETTY_NAME="oeneye (Lubuntu base)"\n' > config/includes.chroot/etc/os-release
      - name: Build
        run: cd live && sudo sed -i "2i exit 0" /usr/lib/live/build/lb_binary_debian-installer && sudo mkdir -p .build && sudo touch .build/binary_debian-installer && sudo lb build
      - uses: actions/upload-artifact@v4
        with:
          name: oeneye-lubuntu-iso
          path: live/*.iso
  void:
    if: inputs.which == 'all' || inputs.which == 'void'
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare
        run: |
          mkdir -p out includedir/etc
          printf 'NAME="oeneye"\nID=oeneye\nID_LIKE=void\nPRETTY_NAME="oeneye (Void base)"\n' > includedir/etc/os-release
          cat > build-void.sh <<'X'
          set -e
          xbps-install -Syu xbps
          xbps-install -Sy git make xz squashfs-tools xorriso dosfstools e2fsprogs bash
          git clone https://github.com/void-linux/void-mklive
          cd void-mklive && make
          ./mkiso.sh -a x86_64 -b base \
            -r https://repo-default.voidlinux.org/current \
            -- -p "xfce4 xorg-minimal git curl" \
            -I /work/includedir -T oeneye -o /out/oeneye-void.iso
          X
      - name: Build in Void container
        run: |
          docker run --rm --privileged -v "$PWD:/work" -v "$PWD/out:/out" \
            ghcr.io/void-linux/void-glibc-full:latest sh -c "xbps-install -Syu xbps; xbps-install -Syu bash && bash /work/build-void.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: oeneye-void-iso
          path: out/*.iso
