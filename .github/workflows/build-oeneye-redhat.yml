name: build-oeneye-redhat
on:
  workflow_dispatch:
  push:
    paths:
      - 'BlackHat.sh'
      - 'oeneye-fedora.ks'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
      - name: Build in Fedora container
        run: docker run --rm --privileged -v "$PWD:/w" -w /w fedora:latest bash BlackHat.sh
      - name: Find ISO
        run: |
          echo "Searching for ISO..."
          find . -type f -name "*.iso" -ls
          ls -R out || true
          ls -R /var/tmp || true
      - uses: actions/upload-artifact@v4
        with:
          name: oeneye-iso
          path: |
            out/**/*.iso
          if-no-files-found: warn
