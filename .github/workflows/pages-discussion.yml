name: Deploy discussion board ROOT (third-party examples)
on:
  push:
    branches: [discussion-board-root]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-discussion
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: discussion-board-root
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site
          cp -r discussion-board/* _site/
          ls -lh _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
