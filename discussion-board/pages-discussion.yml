name: Deploy discussion board ROOT (third-party examples)

on:
  push:
    branches: [discussion-board-root]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-discussion
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ROOT branch
        uses: actions/checkout@v4
        with:
          ref: discussion-board-root

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build ROOT site (copy discussion-board to _site)
        run: |
          mkdir -p _site
          cp -r discussion-board/* _site/
          # Add clear marker that this is third-party example only
          echo "<!-- ROOT: Third-party examples - NOT author original - kaiolafketelhut.github.io screenshots for maintenance reference -->" >> _site/index.html || true
          ls -lh _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
