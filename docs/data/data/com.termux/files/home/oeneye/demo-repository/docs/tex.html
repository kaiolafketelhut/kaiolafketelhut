 document.getElementById('htmlView').style.display = t==='html'?'block':'none';
 document.getElementById('pdfView').style.display = t==='pdf'?'block':'none';
 if(t==='html') renderHTML();
 if(t==='pdf') document.getElementById('pdfView').src='book.pdf';
}
