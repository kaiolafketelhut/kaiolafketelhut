<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>oeneye CUDA-style demo</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#555;--card:#f3f3f3;--bd:#bbb}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#aaa;--card:#1e1e1e;--bd:#444}}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
label{display:inline-block;margin:4px 10px 4px 0;color:var(--mut)}
select,input,button,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px}
input{width:5.5em}
textarea{width:100%;box-sizing:border-box;height:13em;font-family:ui-monospace,monospace;font-size:13px}
button{cursor:pointer;font-weight:600}
pre{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px;white-space:pre-wrap;min-height:3em}
p{color:var(--mut);margin:6px 0}
</style></head><body>
<h3 style="margin:0 0 8px">oeneye CUDA-style demo (CPU, in your browser)</h3>
<label>Example <select id="ex">
<option value="vecadd">vector add</option>
<option value="reduce">sum reduction (shared memory)</option>
<option value="matmul">matrix multiply (naive)</option>
<option value="tiled">matrix multiply (tiled, shared memory)</option>
</select></label>
<label>Size N <input id="n" type="number" min="1"></label>
<label>Block x <input id="bx" type="number" min="1" max="1024"></label>
<label>Block y <input id="by" type="number" min="1" max="32"></label>
<p>Kernel body (JavaScript). Available: threadIdx, blockIdx, blockDim, gridDim, smem(name, size), a, b, c, n. Write <b>yield;</b> where CUDA has __syncthreads().</p>
<textarea id="src" spellcheck="false"></textarea>
<p><button id="run">Run kernel</button></p>
<pre id="out">Press Run.</pre>
<script>
var GF=Object.getPrototypeOf(function*(){}).constructor;
function $(id){return document.getElementById(id);}
var P={
 vecadd:{n:65536,bx:256,by:1,max:4194304,src:[
  "const i = blockIdx.x * blockDim.x + threadIdx.x;",
  "if (i < n) c[i] = a[i] + b[i];"].join("\n"),
  setup:function(n,bx,by){
   var a=new Float32Array(n),b=new Float32Array(n),c=new Float32Array(n),i;
   for(i=0;i<n;i++){a[i]=i%1000;b[i]=2*(i%1000);}
   return{a:a,b:b,c:c,block:{x:bx,y:1,z:1},grid:{x:Math.ceil(n/bx),y:1,z:1},
    check:function(){var bad=0,j;for(j=0;j<n;j++)if(c[j]!==3*(j%1000))bad++;return bad;}};}},
 reduce:{n:65536,bx:256,by:1,max:1048576,src:[
  "const s = smem('s', blockDim.x);",
  "const tid = threadIdx.x;",
  "const i = blockIdx.x * blockDim.x + tid;",
  "s[tid] = i < n ? a[i] : 0;",
  "yield; // __syncthreads()",
  "for (let st = blockDim.x >> 1; st > 0; st >>= 1) {",
  "  if (tid < st) s[tid] += s[tid + st];",
  "  yield; // __syncthreads()",
  "}",
  "if (tid === 0) c[blockIdx.x] = s[0];"].join("\n"),
  setup:function(n,bx,by){
   if(bx&(bx-1))throw new Error("block x must be a power of two for this reduction");
   var a=new Float32Array(n),i,exp=0;
   for(i=0;i<n;i++){a[i]=i%10;exp+=a[i];}
   var grid={x:Math.ceil(n/bx),y:1,z:1},c=new Float32Array(grid.x);
   return{a:a,b:new Float32Array(1),c:c,block:{x:bx,y:1,z:1},grid:grid,
    check:function(){var t=0,j;for(j=0;j<c.length;j++)t+=c[j];return Math.abs(t-exp)>0.5?1:0;}};}},
 matmul:{n:64,bx:16,by:16,max:256,src:[
  "const row = blockIdx.y * blockDim.y + threadIdx.y;",
  "const col = blockIdx.x * blockDim.x + threadIdx.x;",
  "if (row < n && col < n) {",
  "  let s = 0;",
  "  for (let k = 0; k < n; k++) s += a[row * n + k] * b[k * n + col];",
  "  c[row * n + col] = s;",
  "}"].join("\n"),
  setup:function(n,bx,by){return mm(n,bx,by);}},
 tiled:{n:64,bx:16,by:16,max:256,src:[
  "const T = blockDim.x;",
  "const As = smem('As', T * T), Bs = smem('Bs', T * T);",
  "const row = blockIdx.y * T + threadIdx.y;",
  "const col = blockIdx.x * T + threadIdx.x;",
  "let s = 0;",
  "for (let t = 0; t < Math.ceil(n / T); t++) {",
  "  const ac = t * T + threadIdx.x, br = t * T + threadIdx.y;",
  "  As[threadIdx.y * T + threadIdx.x] = (row < n && ac < n) ? a[row * n + ac] : 0;",
  "  Bs[threadIdx.y * T + threadIdx.x] = (br < n && col < n) ? b[br * n + col] : 0;",
  "  yield; // __syncthreads()",
  "  for (let k = 0; k < T; k++) s += As[threadIdx.y * T + k] * Bs[k * T + threadIdx.x];",
  "  yield; // __syncthreads()",
  "}",
  "if (row < n && col < n) c[row * n + col] = s;"].join("\n"),
  setup:function(n,bx,by){
   if(bx!==by)throw new Error("tiled example needs block x = block y");
   return mm(n,bx,by);}}
};
function mm(n,bx,by){
 if(bx*by>1024)throw new Error("block x * block y must be at most 1024");
 var a=new Float32Array(n*n),b=new Float32Array(n*n),c=new Float32Array(n*n),i;
 for(i=0;i<n*n;i++){a[i]=i%7;b[i]=i%5;}
 return{a:a,b:b,c:c,block:{x:bx,y:by,z:1},grid:{x:Math.ceil(n/bx),y:Math.ceil(n/by),z:1},
  check:function(){var bad=0,r,q,s,m;for(r=0;r<n;r++)for(q=0;q<n;q++){s=0;for(m=0;m<n;m++)s+=a[r*n+m]*b[m*n+q];if(c[r*n+q]!==s)bad++;}return bad;}};
}
function load(){var p=P[$("ex").value];$("n").value=p.n;$("bx").value=p.bx;$("by").value=p.by;$("src").value=p.src;}
$("ex").onchange=load;load();
function launch(grid,block,kernel,isGen,a,b,c,n){
 var bi,bj,bk,x,y,z;
 for(bk=0;bk<grid.z;bk++)for(bj=0;bj<grid.y;bj++)for(bi=0;bi<grid.x;bi++){
  var blockIdx={x:bi,y:bj,z:bk},sm={};
  var smem=function(name,size){return sm[name]||(sm[name]=new Float32Array(size));};
  if(!isGen){
   var ti={x:0,y:0,z:0};
   for(z=0;z<block.z;z++)for(y=0;y<block.y;y++)for(x=0;x<block.x;x++){
    ti.x=x;ti.y=y;ti.z=z;kernel(ti,blockIdx,block,grid,smem,a,b,c,n);}
  }else{
   var gens=[];
   for(z=0;z<block.z;z++)for(y=0;y<block.y;y++)for(x=0;x<block.x;x++)
    gens.push(kernel({x:x,y:y,z:z},blockIdx,block,grid,smem,a,b,c,n));
   var alive=gens;
   while(alive.length){
    var next=[],j;
    for(j=0;j<alive.length;j++){if(!alive[j].next().done)next.push(alive[j]);}
    if(next.length&&next.length!==alive.length)
     throw new Error("__syncthreads divergence: some threads finished while others waited at a barrier");
    alive=next;
   }
  }
 }
}
$("run").onclick=function(){
 var out=$("out");out.textContent="Running...";
 setTimeout(function(){
  try{
   var ex=$("ex").value,p=P[ex],src=$("src").value;
   var n=Math.max(1,Math.min(p.max,parseInt($("n").value)||1));
   var bx=Math.max(1,Math.min(1024,parseInt($("bx").value)||1));
   var by=Math.max(1,Math.min(32,parseInt($("by").value)||1));
   var s=p.setup(n,bx,by);
   var isGen=/\byield\b/.test(src);
   var Ctor=isGen?GF:Function;
   var kernel=new Ctor("threadIdx","blockIdx","blockDim","gridDim","smem","a","b","c","n",src);
   var t0=performance.now();
   launch(s.grid,s.block,kernel,isGen,s.a,s.b,s.c,n);
   var ms=performance.now()-t0;
   var bad=s.check();
   out.textContent=(bad?"FAIL":"OK")+": "+(s.grid.x*s.grid.y*s.block.x*s.block.y)+" threads, grid "+s.grid.x+"x"+s.grid.y+", block "+s.block.x+"x"+s.block.y+(isGen?" (with barriers)":"")+", "+bad+" wrong, "+ms.toFixed(1)+" ms";
  }catch(e){out.textContent="Error: "+e.message;}
 },20);
};
</script></body></html>
