<h1>Proxy: holla_proxy</h1>
<p>holla_proxy.py is a small static file server (Python http.server). It serves its own folder on port 8080 and listens on 127.0.0.1 only. It does not forward requests to other servers.</p>
<pre>python3 holla_proxy.py
# then open http://127.0.0.1:8080</pre>
<p><a href="holla_proxy.py">Raw</a> | <a href="https://github.com/Colegio-San-Caio/demo-repository/blob/main/holla_proxy.py">GitHub</a></p>
<pre id="src">Loading...</pre>
<script>
fetch('holla_proxy.py').then(function(r){return r.text()}).then(function(t){document.getElementById('src').textContent=t}).catch(function(){document.getElementById('src').textContent='Could not load source.'});
</script>
