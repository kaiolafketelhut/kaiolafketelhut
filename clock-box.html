<!doctype html><meta charset="utf-8"><style>body{margin:0;padding:12px;background:#0d1117;color:#c9d1d9;font-family:system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;box-sizing:border-box} #time{font-size:48px;font-weight:700;letter-spacing:2px;color:#fff} #date{font-size:14px;opacity:.7;margin-top:6px} #tz{font-size:12px;color:#58a6ff;margin-top:10px}</style><div id="time">--:--:--</div><div id="date"></div><div id="tz">Berlin / West Germany - CEST GMT+2</div><script>function tick(){let d=new Date();let opt={timeZone:"Europe/Berlin"};document.getElementById("time").textContent=d.toLocaleTimeString("de-DE",{timeZone:"Europe/Berlin",hour12:false});document.getElementById("date").textContent=d.toLocaleDateString("en-GB",{timeZone:"Europe/Berlin",weekday:"long",year:"numeric",month:"long",day:"numeric"})}setInterval(tick,1000);tick()</script>
