name: OeneyeDOS
options:
  bundleIdPrefix: org.oeneye
  deploymentTarget:
    iOS: "16.0"
targets:
  OeneyeDOS:
    type: application
    platform: iOS
    sources: [OeneyeDOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.oeneye.dos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oeneye DOS
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
