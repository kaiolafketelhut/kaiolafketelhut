<div class="box"><b>Linux Terminal (kernel <span id="kv">7.3</span>, in your browser)</b><br>
<canvas id="omq" width="1200" height="630" style="width:100%;max-width:600px;background:#000;color:#0f0;font:12px monospace"></canvas>
<textarea id="ser" rows="16" spellcheck="false" style="display:none;width:100%;max-width:600px;box-sizing:border-box;font:12px monospace;background:#000;color:#0f0"></textarea><br>
<button id="omqgo" style="padding:8px 14px">Boot Linux</button>
<div id="omqmsg" style="font:12px monospace">Booting... tap the black box to type</div></div>
<script>
(async()=>{try{
const r=await fetch('OMQpreview.ximg');const b=new Uint8Array(await r.arrayBuffer());
if(String.fromCharCode(...b.slice(0,4))!=='XIMG')throw 'bad magic';
const dv=new DataView(b.buffer);const w=dv.getUint32(6,true),h=dv.getUint32(10,true),f=b[5];
let raw=b.slice(14);
if(f&1){raw=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer())}
const c=document.getElementById('omq');c.width=w;c.height=h;
c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(raw.buffer,raw.byteOffset,w*h*4),w,h),0,0);
}catch(e){document.getElementById('omqmsg').textContent='XIMG preview: '+e}})();
document.getElementById('omqgo').onclick=async()=>{
const m=document.getElementById('omqmsg'),t=document.getElementById('ser');
try{
m.textContent='Loading emulator...';
await new Promise((ok,no)=>{const s=document.createElement('script');s.src='docs/v86/libv86.js';s.onload=ok;s.onerror=()=>no('libv86.js missing');document.head.append(s)});
t.style.display='block';document.getElementById('omq').style.display='none';
new V86({wasm_path:'docs/v86/v86.wasm',memory_size:64*1024*1024,vga_memory_size:2*1024*1024,bios:{url:'docs/v86/seabios.bin'},vga_bios:{url:'docs/v86/vgabios.bin'},bzimage:{url:'docs/web-linux/latest/bzImage'},cmdline:'console=ttyS0',serial_container:t,autostart:true});
m.textContent='Booting... tap the black box to type';
}catch(e){m.textContent='Error: '+e}};
</script>
