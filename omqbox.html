<div class="box"><b>Linux Terminal (current kernel, in your browser)</b><br>
<canvas id="omq" width="1200" height="630" style="width:100%;max-width:600px;background:#14181f"></canvas>
<div id="omqmsg" style="font-size:12px">OMQpreview.ximg · kernel terminal coming next</div></div>
<script>
(async()=>{try{
const r=await fetch('OMQpreview.ximg');const b=new Uint8Array(await r.arrayBuffer());
if(String.fromCharCode(...b.slice(0,4))!=='XIMG')throw 'bad magic';
const dv=new DataView(b.buffer);const w=dv.getUint32(6,true),h=dv.getUint32(10,true),f=b[5];
let raw=b.slice(14);
if(f&1){raw=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer())}
const c=document.getElementById('omq');c.width=w;c.height=h;
c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(raw.buffer,raw.byteOffset,w*h*4),w,h),0,0);
}catch(e){document.getElementById('omqmsg').textContent='XIMG error: '+e}})();
</script>
